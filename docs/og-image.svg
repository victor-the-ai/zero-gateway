<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#090d16"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="greenGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Glow and Grid Layers -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="600" cy="220" r="500" fill="url(#greenGlow)"/>

  <!-- Logo and Brand Header -->
  <g transform="translate(100, 90)">
    <!-- Logo Icon -->
    <rect width="56" height="56" rx="16" fill="url(#logoGrad)"/>
    <path d="M30 14L18 30H29L27 42L40 26H28L30 14Z" fill="#090d16" stroke="#090d16" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Title Text -->
    <text x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Zerogateway</text>
    
    <!-- Version Pill -->
    <rect x="290" y="16" width="68" height="26" rx="13" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="324" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">v0.1.1</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    Never hit an <tspan fill="url(#textGrad)">HTTP 429</tspan>
  </text>
  <text x="100" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    rate limit again.
  </text>

  <!-- Tagline / Subtitle -->
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Unified client router and OpenAI-compatible proxy for free LLMs.
  </text>
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Multi-key auto swapping, quota reset tracking, and zero-downtime cascading.
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(100, 480)">
    <!-- Badge 1: 100% Free Access -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="#0f172a" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="24" cy="24" r="5" fill="#10b981"/>
    <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">100% Free AI Access</text>

    <!-- Badge 2: Multi-Key Swapping -->
    <rect x="236" y="0" width="230" height="48" rx="12" fill="#0f172a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="256" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">⚡ Multi-Key Swapping</text>

    <!-- Badge 3: OpenAI Proxy -->
    <rect x="482" y="0" width="230" height="48" rx="12" fill="#0f172a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="502" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">🔌 OpenAI-Compatible</text>

    <!-- Badge 4: Python & npm -->
    <rect x="728" y="0" width="270" height="48" rx="12" fill="#0f172a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="748" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">📦 Python SDK + npm SDK</text>
  </g>
</svg>
