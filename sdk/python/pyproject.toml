[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerogateway"
version = "0.1.0"
description = "A unified router and client for free LLM providers with automatic rate-limit failover"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Zerogateway Contributors"}
]
urls = { Homepage = "https://github.com/victor-the-ai/zero-gateway", Repository = "https://github.com/victor-the-ai/zero-gateway", Issues = "https://github.com/victor-the-ai/zero-gateway/issues" }
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "rich>=13.0.0",
    "click>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[project.scripts]
zerogateway = "zerogateway.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zerogateway*"]

[tool.setuptools.package-data]
zerogateway = ["data/*.json", "data/*.html"]


